name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Swap sitemap for GitHub domain
        run: |
          cp dist/sitemap-github.xml dist/sitemap.xml
          rm dist/sitemap-github.xml

      # PHP does not execute on GitHub Pages — these sub-apps would be
      # served as raw source (including admin/ files). They live on
      # yourfiyan.me only; the SPA links to them cross-domain.
      - name: Strip PHP-backed sub-apps from static artifact
        run: rm -rf dist/live/pocketphone dist/live/music_player

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
